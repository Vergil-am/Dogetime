org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.code.style=official
# The iOS source set is wired by hand in composeApp/build.gradle.kts, so the default hierarchy is off.
kotlin.mpp.applyDefaultHierarchyTemplate=false
android.nonTransitiveRClass=true
android.useAndroidX=true
kotlin.native.ignoreDisabledTargets=true
# Compile Kotlin inside the Gradle daemon instead of a shared Kotlin daemon. Android Studio
# (Flatpak) and terminal builds otherwise share one compiler process and pass it JDK paths
# that only exist on their own side ("JDK home directory does not exist: /app/extra/jbr").
kotlin.compiler.execution.strategy=in-process
